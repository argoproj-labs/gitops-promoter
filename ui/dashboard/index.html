<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitOps Promoter</title>
    <script>
      // Apply the color theme before first paint to avoid a light flash in dark
      // mode. Mirrors src/stores/ThemeStore.ts, which takes over once loaded.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('gitops-promoter:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.classList.add('theme-' + theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
