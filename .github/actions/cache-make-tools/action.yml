name: Cache Makefile tools
description: >-
  Restore the tools the Makefile installs under bin/ (controller-gen, kustomize, setup-envtest and the
  Kubernetes binaries it downloads, golangci-lint, nilaway, deadcode, mockery) so a job does not rebuild
  them from the module proxy on every run. The Makefile names each binary after its version and stamps
  the Go version it was built with, so a restored tool is used only when both still match; anything
  missing or stale is installed as before. bin/manager is excluded: the unit-test job caches it on its
  own key.
runs:
  using: composite
  steps:
    - name: Restore Makefile tools from cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          bin/
          !bin/manager
        # The key carries the workflow and job because each job installs a different set of tools and
        # actions/cache saves only on a miss: with one shared key the quickest job (Dead Code Analysis,
        # which installs deadcode alone) wins the save, every other job then gets an exact hit on that
        # entry and never saves, and the cache holds a single tool for as long as the hash is stable.
        # Matrix legs of one job install the same tools, so sharing a key between them is fine.
        # Tool versions and ENVTEST_K8S_VERSION live in the Makefile; the Go toolchain version lives in go.mod.
        key: ${{ runner.os }}-make-tools-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Makefile', 'go.mod') }}
        restore-keys: |
          ${{ runner.os }}-make-tools-${{ github.workflow }}-${{ github.job }}-
