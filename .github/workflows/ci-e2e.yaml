name: test-e2e
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Three-minor sliding window for Kind e2e coverage. Renovate bumps individual
        # kindest/node entries; when the newest minor advances, add the new version
        # and drop the oldest so the matrix stays at three consecutive minors.
        kubernetes-minor-version:
          - 1.34.8
          - 1.35.5
          - 1.36.1
    name: E2E Tests (${{ matrix.kubernetes-minor-version }})
    runs-on: ubuntu-latest
    # The suite builds two images and promotes through every provider of the test SCM server.
    timeout-minutes: 30
    steps:
      # Checkout comes first: setup-go keys its module and build cache on go.sum, which has to be in the
      # workspace when the action runs. With the steps the other way round every leg logged
      # "Restore cache failed: Some specified paths were not resolved" and re-downloaded every module.
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          # see https://github.com/actions/setup-go?tab=readme-ov-file#caching-dependency-files-and-build-outputs
          cache-dependency-path: |
            go.sum
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind
          version: v0.33.0
          node_image: kindest/node:v${{ matrix.kubernetes-minor-version }}
          kubectl_version: v${{ matrix.kubernetes-minor-version }}
      - name: Run E2E-Tests
        run: |
          if [ -z "$JOB_INDEX" ]; then
            echo "strategy.job-index is unset, so no matrix leg would collect coverage"
            exit 1
          fi
          make test-e2e
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          # The second matrix leg (index 1) builds the manager with -cover and writes a profile. job-index follows
          # the version list, so a Renovate bump of a kindest/node patch does not drop the upload. The other legs
          # run the release-shaped image.
          E2E_COVERAGE: ${{ strategy.job-index == 1 && '1' || '0' }}
      - name: Upload e2e test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Ginkgo JUnit report from make test-e2e. Every matrix leg uploads, flagged by Kubernetes version,
          # so a flake on one version is not hidden by a pass on another.
          report_type: test_results
          files: e2e-junit.xml
          flags: e2e-k8s-${{ matrix.kubernetes-minor-version }}
          name: e2e-k8s-${{ matrix.kubernetes-minor-version }}
          disable_search: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Convert e2e coverage
        id: e2e-coverage
        if: ${{ !cancelled() && strategy.job-index == 1 }}
        run: |
          cluster="${KIND_CLUSTER:-kind}"
          mkdir -p e2e-covdata
          docker cp "${cluster}-control-plane:/var/promoter-cover/." e2e-covdata/
          # covmeta is written when the covered process starts. covcounters is written when it exits.
          # textfmt accepts meta alone and emits an all-zero profile, so require both.
          if ! ls e2e-covdata/covmeta.* >/dev/null 2>&1; then
            echo "the controller wrote no coverage metadata (covmeta.*)"
            exit 1
          fi
          if ! ls e2e-covdata/covcounters.* >/dev/null 2>&1; then
            echo "the controller wrote no coverage counters (covcounters.*)"
            exit 1
          fi
          go tool covdata textfmt -i=e2e-covdata -o e2e-cover.out
      - name: Upload e2e coverage to Codecov
        if: ${{ !cancelled() && strategy.job-index == 1 && steps.e2e-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # flags labels this upload in the Codecov UI. It still merges into the project total alongside the
          # integration upload from the unit-test workflow.
          files: e2e-cover.out
          flags: e2e
          name: e2e
          disable_search: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  e2e:
    # Stable status check for branch protection; matrix jobs above may change names when
    # kindest/node versions bump, but this job name stays constant.
    name: E2E Tests
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix jobs passed
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "One or more E2E matrix jobs failed or were cancelled."
            exit 1
          fi
