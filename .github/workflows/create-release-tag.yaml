# Lightweight workflow: detects the "docs: bump manifest versions to vX.Y.Z"
# commit on main or a release-X.Y branch, creates + pushes the corresponding
# git tag, then dispatches the release workflow (release.yaml) on that tag ref
# so the OIDC signing identity is refs/tags/vX.Y.Z.
name: Create Release Tag

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'docs/getting-started.md'
      - 'docs/integrating-with-argocd/tutorial.md'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  create-tag:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: write
      issues: write
    if: >-
      !contains(github.event.head_commit.message, 'Revert') &&
      startsWith(github.event.head_commit.message, 'docs: bump manifest versions to v')
    name: Create Tag and Dispatch Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          raw_version=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [[ -z "$raw_version" ]]; then
            echo "::error::The release commit does not contain a stable vX.Y.Z version."
            exit 1
          fi

          release_env=$(./hack/release-line.sh "$raw_version")
          eval "$release_env"

          case "$REF_NAME" in
            main)
              if [[ "$patch" != "0" ]]; then
                echo "::error::Patch releases must be merged to ${release_branch}, not main."
                exit 1
              fi
              create_release_branch=true
              ;;
            "$release_branch")
              if [[ "$patch" == "0" ]]; then
                echo "::error::Minor releases must be merged to main."
                exit 1
              fi
              create_release_branch=false
              ;;
            *)
              echo "::error::Version ${version} does not belong on branch ${REF_NAME}."
              exit 1
              ;;
          esac

          {
            echo "version=$version"
            echo "release_branch=$release_branch"
            echo "create_release_branch=$create_release_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release app token
        id: release-token
        if: steps.release.outputs.create_release_branch == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Create release branch and cherry-pick label
        if: steps.release.outputs.create_release_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          if remote_sha=$(git ls-remote --heads origin "$RELEASE_BRANCH" | cut -f1) && [[ -n "$remote_sha" ]]; then
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_BRANCH} already exists at ${remote_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
          else
            # GITHUB_TOKEN cannot create a branch whose commit contains workflow
            # files. The release app token has the Workflows permission.
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "${GITHUB_SHA}:refs/heads/${RELEASE_BRANCH}"
          fi

          version_number=${RELEASE_BRANCH#release-}
          gh label create "cherry-pick/${version_number}" \
            --color "0E8A16" \
            --description "Backport a merged PR to ${RELEASE_BRANCH}" \
            --force

      - name: Create and push tag
        if: steps.release.outputs.version != ''
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ steps.release.outputs.version }}

      - name: Dispatch release workflow on tag ref
        if: steps.release.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh workflow run release.yaml --ref "$VERSION"
