name: npm audit fix

on:
  schedule:
    - cron: '0 10 * * *'  # 06:00 EDT (UTC-4, Mar–Nov)
    - cron: '0 11 * * *'  # 06:00 EST (UTC-5, Nov–Mar)
  workflow_dispatch:
    inputs:
      force:
        description: "Run with --force (upgrades to latest, may include breaking changes)"
        default: "false"
        required: false
        type: boolean

concurrency:
  group: npm-audit-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-audit-fix:
    name: Run npm audit fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Run npm audit fix
        id: audit-fix
        env:
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
        run: |
          for pkg in ui/dashboard ui/extension ui/components-lib; do
            cd "$GITHUB_WORKSPACE/$pkg"
            npm install
            # npm audit fix exits 1 when devDependency vulns remain; CI only checks prod deps.
            npm audit fix $FORCE_FLAG || true
          done
          if [ "$FORCE_FLAG" = "--force" ]; then
            # Explicit --force was requested; record it regardless of audit result.
            cd "$GITHUB_WORKSPACE/ui/dashboard" && npm audit --omit=dev
            cd "$GITHUB_WORKSPACE/ui/extension" && npm audit --omit=dev
            echo "force_used=true" >> "$GITHUB_OUTPUT"
          elif cd "$GITHUB_WORKSPACE/ui/dashboard" && npm audit --omit=dev && \
               cd "$GITHUB_WORKSPACE/ui/extension" && npm audit --omit=dev; then
            echo "force_used=false" >> "$GITHUB_OUTPUT"
          else
            echo "Regular npm audit fix did not resolve all prod vulnerabilities; retrying with --force"
            for pkg in ui/dashboard ui/extension ui/components-lib; do
              cd "$GITHUB_WORKSPACE/$pkg"
              npm audit fix --force || true
            done
            cd "$GITHUB_WORKSPACE/ui/dashboard" && npm audit --omit=dev
            cd "$GITHUB_WORKSPACE/ui/extension" && npm audit --omit=dev
            echo "force_used=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare PR body
        id: pr-body
        run: |
          BODY="Automated PR to fix npm audit vulnerabilities.

          Generated by the [npm audit fix](https://github.com/argoproj-labs/gitops-promoter/actions/workflows/npm-audit-fix.yaml) workflow."
          if [ "${{ steps.audit-fix.outputs.force_used }}" = "true" ]; then
            BODY="$BODY

          > [!WARNING]
          > This PR was generated using \`npm audit fix --force\` because a regular fix was insufficient. It may contain **breaking changes** due to major version upgrades."
          fi
          BODY="$BODY

          > [!NOTE]
          > After the PR is created, you must **close and reopen it** to trigger CI checks."
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: npm audit fix"
          title: "chore: npm audit fix"
          body: ${{ steps.pr-body.outputs.body }}
          branch: npm-audit-fix/automated
          delete-branch: true
          signoff: true
