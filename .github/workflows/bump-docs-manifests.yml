name: Bump Docs Manifests

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New version (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-docs:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Select release branch
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must have the form X.Y.Z without a v prefix."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$NEW_VERSION"
          release_branch="release-${major}.${minor}"
          release_label="cherry-pick/${major}.${minor}"

          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/v${NEW_VERSION}" >/dev/null; then
            echo "::error::Tag v${NEW_VERSION} already exists."
            exit 1
          fi

          if [[ "$patch" == "0" ]]; then
            latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [[ -n "$latest_tag" ]] &&
              [[ "$(printf '%s\n' "${latest_tag#v}" "$NEW_VERSION" | sort -V | tail -n 1)" != "$NEW_VERSION" ]]; then
              echo "::error::v${NEW_VERSION} must be newer than the latest tag, ${latest_tag}."
              exit 1
            fi
            if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
              echo "::error::${release_branch} already exists; new minor releases must create a new release line."
              exit 1
            fi
            base_branch=main
          else
            latest_series_tag=$(git tag --list "v${major}.${minor}.*" --sort=-v:refname | head -n 1)
            if [[ -z "$latest_series_tag" ]]; then
              echo "::error::Cannot patch ${major}.${minor}: no existing v${major}.${minor}.Z release was found."
              exit 1
            fi

            latest_patch=${latest_series_tag##*.}
            if (( patch <= latest_patch )); then
              echo "::error::Patch version ${patch} must be greater than ${latest_patch} (${latest_series_tag})."
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
              # Lazily bootstrap release lines that predate this automation.
              release_sha=$(git rev-list -n 1 "$latest_series_tag")
              git push origin "${release_sha}:refs/heads/${release_branch}"
            fi

            gh label create "$release_label" \
              --color "0E8A16" \
              --description "Backport a merged PR to ${release_branch}" \
              --force
            base_branch=$release_branch
          fi

          git fetch origin "$base_branch"
          if [[ "$patch" != "0" ]] &&
            ! git merge-base --is-ancestor "$latest_series_tag" "origin/$base_branch"; then
            echo "::error::${base_branch} does not contain its latest tag, ${latest_series_tag}."
            exit 1
          fi
          git checkout -B "$base_branch" "origin/$base_branch"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"

      - name: Set up Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Bump manifest versions in docs
        run: |
          chmod +x hack/bump-docs-manifests.sh
          ./hack/bump-docs-manifests.sh "${GITHUB_EVENT_INPUTS_NEW_VERSION}"
          git add docs/getting-started.md docs/integrating-with-argocd/tutorial.md docs/integrating-with-argocd/index.md cmd/demo/config/promoter_version cmd/demo/config/argocd-extension.yaml cmd/demo/config/config.yaml
        env:
          GITHUB_EVENT_INPUTS_NEW_VERSION: ${{ github.event.inputs.new_version }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "docs: bump manifest versions to v${{ github.event.inputs.new_version }}"
          title: "docs: bump manifest versions to v${{ github.event.inputs.new_version }}"
          body: "Automated PR to bump manifest versions in documentation for `${{ steps.release.outputs.base_branch }}`."
          base: ${{ steps.release.outputs.base_branch }}
          branch: "bump-docs-manifests/v${{ github.event.inputs.new_version }}"
          delete-branch: true
          signoff: true

