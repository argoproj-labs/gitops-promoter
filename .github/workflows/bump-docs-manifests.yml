name: Bump Docs Manifests

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New version (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-docs:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Select release branch
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.release-token.outputs.token }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          git fetch --force --tags origin
          release_env=$(./hack/release-line.sh "$NEW_VERSION")
          eval "$release_env"

          if [[ "$patch" == "0" ]]; then
            if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
              echo "::error::${release_branch} already exists; new minor releases must create a new release line."
              exit 1
            fi
            base_branch=main
          else
            if ! git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
              # Create the branch at an existing commit. GITHUB_TOKEN cannot add the
              # workflow files in that commit; the release app can.
              release_sha=$(git rev-list -n 1 "$latest_series_tag")
              GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${release_branch}" \
                -f sha="${release_sha}"
            fi

            gh label create "$release_label" \
              --color "0E8A16" \
              --description "Backport a merged PR to ${release_branch}" \
              --force
            base_branch=$release_branch
          fi

          git fetch origin "$base_branch"
          if [[ "$patch" != "0" ]] &&
            ! git merge-base --is-ancestor "$latest_series_tag" "origin/$base_branch"; then
            echo "::error::${base_branch} does not contain its latest tag, ${latest_series_tag}."
            exit 1
          fi
          git checkout -B "$base_branch" "origin/$base_branch"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"

      - name: Set up Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Bump manifest versions in docs
        run: |
          chmod +x hack/bump-docs-manifests.sh
          ./hack/bump-docs-manifests.sh "${GITHUB_EVENT_INPUTS_NEW_VERSION}"
          git add docs/getting-started.md docs/integrating-with-argocd/tutorial.md docs/integrating-with-argocd/index.md cmd/demo/config/promoter_version cmd/demo/config/argocd-extension.yaml cmd/demo/config/config.yaml
        env:
          GITHUB_EVENT_INPUTS_NEW_VERSION: ${{ github.event.inputs.new_version }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "docs: bump manifest versions to v${{ github.event.inputs.new_version }}"
          title: "docs: bump manifest versions to v${{ github.event.inputs.new_version }}"
          body: "Automated PR to bump manifest versions in documentation for `${{ steps.release.outputs.base_branch }}`."
          base: ${{ steps.release.outputs.base_branch }}
          branch: "bump-docs-manifests/v${{ github.event.inputs.new_version }}"
          delete-branch: true
          signoff: true

