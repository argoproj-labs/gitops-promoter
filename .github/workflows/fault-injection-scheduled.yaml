# Controller integration tests against every scmserver provider with Kubernetes write faults and SCM request
# faults injected. Too slow for PR CI, which runs the suite once against the fake SCM with K8s faults only.
# Specs labelled fake-scm-only are skipped (see `make test-scm-provider`).
name: fault injection scheduled
on:
  schedule:
    - cron: '42 7 * * 1' # Mondays 07:42 UTC
  workflow_dispatch:
    inputs:
      providers:
        description: JSON list of scmserver providers to run
        default: '["github","gitlab","azuredevops","bitbucket","gitea","forgejo","bitbucketdatacenter"]'
      k8s_fault_probability:
        description: Fraction of Kubernetes writes to fail, in (0, 1]
        default: "0.02"
      scm_fault_probability:
        description: Fraction of SCM API and git requests to fail, in (0, 1]
        default: "0.02"

permissions:
  contents: read

concurrency:
  # Separate groups so a manual run never cancels a scheduled one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers || '["github","gitlab","azuredevops","bitbucket","gitea","forgejo","bitbucketdatacenter"]') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Start the test SCM server
        run: make start-scm-server SCM_SERVER_LOG_LEVEL=info
      - name: Run integration tests
        run: make test-scm-provider SCM_PROVIDER="$PROVIDER" SCM_PROVIDER_TEST_TIMEOUT=75m
        env:
          PROVIDER: ${{ matrix.provider }}
          K8S_FAULT_PROBABILITY: ${{ inputs.k8s_fault_probability || '0.02' }}
          PROMOTER_TEST_SCM_FAULT_PROBABILITY: ${{ inputs.scm_fault_probability || '0.02' }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fault-injection-${{ matrix.provider }}
          path: |
            junit.xml
            bin/scm-server.log
          if-no-files-found: ignore

  report:
    name: Report to tracking issue
    needs: integration
    # Manual runs are experiments; only scheduled runs touch the issue.
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          title="Scheduled fault-injection run failed"
          label="fault-injection"
          issue=$(gh issue list --state open --label "$label" --search "in:title \"$title\"" --json number --jq '.[0].number // empty')

          # A cancelled run says nothing about the providers; leave the issue alone.
          if [ "$RESULT" = "cancelled" ]; then
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Passed on every provider: $RUN_URL"
            fi
            exit 0
          fi

          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.name | startswith("Integration (")) | select(.conclusion != "success") | "- \(.name): \(.conclusion) (\(.url))"')
          body=$(printf 'Run: %s\n\nFailed legs:\n%s\n' "$RUN_URL" "${failed:-"(none reported; integration result was $RESULT)"}")

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh label create "$label" --color d93f0b --description "Scheduled fault-injection test failures" --force
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
