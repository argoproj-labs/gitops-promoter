# This file must be kept in sync with release-latest.yaml except for the
# trigger, job name, and release section.
#
# Triggered by workflow_dispatch, dispatched by create-release-tag.yaml on a
# tag ref. The workflow only runs when github.ref is a tag, ensuring the
# Sigstore OIDC certificate identity is refs/tags/vX.Y.Z.
#
# SLSA Build L3: provenance is generated by slsa-github-generator reusable
# workflows in separate jobs, so the build job cannot forge it. The build job
# only reports artifact hashes and the image digest. Build caches are disabled
# so a cache written by another workflow cannot influence the release.
name: release

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GORELEASER_PREVIOUS_TAG: ${{vars.GORELEASER_PREVIOUS_TAG}}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    if: startsWith(github.ref, 'refs/tags/')
    name: Release
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
      image-digest: ${{ steps.subjects.outputs.image-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: type=image,tag=29.1.5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          # SLSA Build L3 requires builds not be influenced by caches other
          # workflows can write to.
          cache: false

      - name: Docker Login in quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute provenance subjects
        id: subjects
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
          IMAGE: quay.io/argoprojlabs/gitops-promoter:${{ github.ref_name }}
        run: |
          set -euo pipefail
          checksum_file=$(jq -r '.[] | select(.type == "Checksum") | .path' <<<"$ARTIFACTS")
          echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"
          digest=$(jq -r --arg image "$IMAGE" '.[] | select(.type == "Docker Manifest" and .name == $image) | .extra.Digest' <<<"$ARTIFACTS")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not find the manifest digest for $IMAGE (got '$digest')"
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

  # The reusable workflow verifies its own ref, so it must be pinned to a tag
  # rather than a commit SHA.
  provenance-artifacts:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: gitops-promoter.intoto.jsonl

  # The generator's own upload step can't find draft releases by tag, so attach
  # the provenance to the GoReleaser draft release here.
  upload-provenance:
    needs: [provenance-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    name: Upload Provenance
    steps:
      - name: Download provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance-artifacts.outputs.provenance-name }}

      - name: Attach provenance to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PROVENANCE: ${{ needs.provenance-artifacts.outputs.provenance-name }}
        run: gh release upload "$TAG" "$PROVENANCE" --clobber

  provenance-image:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: quay.io/argoprojlabs/gitops-promoter
      digest: ${{ needs.release.outputs.image-digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_USERNAME }}
      registry-password: ${{ secrets.QUAY_TOKEN }}
