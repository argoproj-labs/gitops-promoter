version: 2
updates:
  # Note: CI/Docker Go toolchain and golangci-lint version updates are handled by
  # Renovate. The go.mod go directive is not auto-bumped for patches; see
  # hack/go-fix-maybe-bump.sh for language-version raises after go fix.
  # The coupled Kubernetes platform packages (tagged k8s.io/*, controller-runtime,
  # multicluster-runtime, staging deps) are owned by Renovate; kube-openapi and
  # structured-merge-diff are follower deps (see RENOVATE_SETUP.md). Ignored here
  # to avoid duplicate PRs. go-github (major /vNN paths) and ghinstallation are
  # also Renovate-owned for import rewrites on major bumps.
  # See renovate.json5 for configuration.
  - package-ecosystem: "gomod"
    # hack/celcost is a separate module (kept out of the root build); it needs its
    # own entry or its indirect deps go stale and show up in the Scorecard
    # Vulnerabilities check.
    directories:
      - "/"
      - "/hack/celcost"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # By default Dependabot only bumps direct requires. Allow both so indirect
    # modules listed in go.mod (e.g. golang.org/x/crypto) also get update PRs.
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "k8s.io/*"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "sigs.k8s.io/multicluster-runtime"
      - dependency-name: "sigs.k8s.io/structured-merge-diff/*"
      - dependency-name: "sigs.k8s.io/json"
      - dependency-name: "sigs.k8s.io/randfill"
      - dependency-name: "github.com/google/go-github/*"
      - dependency-name: "github.com/bradleyfalzon/ghinstallation/*"
    groups:
      # Single-segment `*` globs miss nested Go module paths (e.g. swag/jsonname,
      # genproto/googleapis/api); use `**` so submodules stay in the group PR.
      go-etcd:
        patterns:
          - "go.etcd.io/etcd/**"
      # otel core, exporters, contrib instrumentation, and proto/otlp share a release train.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/**"
      # crypto, net, sys, text, tools, etc. often bump in the same Dependabot cycle.
      golang-org-x:
        patterns:
          - "golang.org/x/**"
      # swag root, jsonpointer/jsonreference, and swag/* submodules version together.
      go-openapi:
        patterns:
          - "github.com/go-openapi/**"
      # genproto, grpc, and protobuf are a coupled gRPC stack.
      google-golang-org:
        patterns:
          - "google.golang.org/**"
      # client_golang plus client_model/common/procfs.
      prometheus:
        patterns:
          - "github.com/prometheus/**"
      # Catch-all for indirect modules. Groups cannot select by dependency type,
      # so direct requires are excluded by name and get individual PRs instead.
      # Dependabot puts a module in the first group it matches, so the coupled
      # groups above take precedence over this one. Keep this group last, and add
      # new direct requires (from either go.mod) to exclude-patterns.
      go-indirect:
        patterns:
          - "**"
        exclude-patterns:
          - "code.gitea.io/sdk/gitea"
          - "codeberg.org/mvdkleijn/forgejo-sdk/forgejo/v2"
          - "github.com/AlecAivazis/survey/v2"
          - "github.com/Azure/azure-sdk-for-go/sdk/azcore"
          - "github.com/Azure/azure-sdk-for-go/sdk/azidentity"
          - "github.com/expr-lang/expr"
          - "github.com/fatih/color"
          - "github.com/gin-contrib/gzip"
          - "github.com/gin-gonic/gin"
          - "github.com/go-logr/logr"
          - "github.com/go-task/slim-sprig/v3"
          - "github.com/golang/groupcache"
          - "github.com/google/uuid"
          - "github.com/ktrysmt/go-bitbucket"
          - "github.com/microsoft/azure-devops-go-api/azuredevops/v7"
          - "github.com/onsi/ginkgo/v2"
          - "github.com/onsi/gomega"
          - "github.com/prometheus/client_golang"
          - "github.com/prometheus/client_model"
          - "github.com/robfig/cron/v3"
          - "github.com/sosedoff/gitkit"
          - "github.com/spf13/cobra"
          - "github.com/spf13/pflag"
          - "github.com/stretchr/testify"
          - "github.com/tidwall/gjson"
          - "gitlab.com/gitlab-org/api/client-go"
          - "go.uber.org/zap"
          - "golang.org/x/oauth2"
          - "golang.org/x/sync"
          - "golang.org/x/time"
          - "gopkg.in/yaml.v3"
          - "sigs.k8s.io/yaml"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # One grouped PR per week; action bumps here have been low-risk.
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
