rules:
  anonymous-definition:
    disable: true
  archived-uses:
    disable: true
  artipacked:
    disable: true
  bot-conditions:
    disable: true
  cache-poisoning:
    disable: true
  concurrency-limits:
    disable: true
  # The cherry-pick workflow intentionally uses pull_request_target. It only
  # handles already-merged commits and never checks out or executes fork code.
  # dependabot-auto-merge-revoke.yaml uses it so a PR can't edit away its own
  # revocation; it only calls the API and never runs PR code.
  dangerous-triggers:
    ignore:
      - cherry-pick.yml
      - dependabot-auto-merge-revoke.yaml
  dependabot-cooldown:
    disable: true
  dependabot-execution:
    disable: true
  forbidden-uses:
    disable: true
  impostor-commit:
    disable: true
  known-vulnerable-actions:
    disable: true
  ref-confusion:
    disable: true
  secrets-outside-env:
    disable: true
  self-hosted-runner:
    disable: true
  stale-action-refs:
    disable: true
  superfluous-actions:
    disable: true
  undocumented-permissions:
    disable: true
