apiVersion: promoter.argoproj.io/v1alpha1
kind: ChangeTransferPolicyHistory
metadata:
  name: example-promotion-strategy-environment-dev-history
spec:
  gitRepositoryRef:
    name: example-git-repository
  activeBranch: environment/dev
  # Optional repository subpath for the environment's active state. When set, hydrator metadata
  # is read from <activePath>/hydrator.metadata.
  activePath: apps/dev
status:
  observedGeneration: 123 # compare with metadata.generation to detect stale status
  conditions:
    # The Ready condition indicates that the resource has been successfully reconciled, when there is an error during
    # reconciliation, the condition will be False with a reason of ReconciliationError. When we successfully reconcile the resource,
    # the condition will be True with a reason of ReconciliationSuccess. The Ready condition is essentially a way to show reconciliation
    # errors to the user. This condition exists on all resources that have reconciliation logic.
    - type: Ready
      lastTransitionTime: 2023-10-01T00:00:00Z
      message: Reconciliation succeeded
      reason: ReconciliationSuccess # ReconciliationSuccess or ReconciliationError
      status: "True" # "True," "False," or "Unknown"
      observedGeneration: 123
  history:
    # Recent promotions merged by the controller (newest first, at most 20 entries).
    - active:
        dry:
          sha: "fedcba0987654321fedcba0987654321fedcba09"
      proposed:
        hydrated:
          sha: "abcdef1234567890abcdef1234567890abcdef12"
        commitStatuses:
          - key: example-key
            phase: success
      pullRequest:
        id: "847"
        state: merged
        prCreationTime: 2023-09-01T00:00:00Z
        prMergeTime: 2023-09-01T01:00:00Z
        url: https://github.com/org/repo/pull/847
        # In a history entry this is the active-branch commit the entry describes (same as active.hydrated.sha).
        mergedTargetSha: "3333333333333333333333333333333333333333"
    # A promotion whose PR was merged externally after the proposed branch advanced. The proposed dry sha is
    # re-read from the merge commit, and the proposed hydrated sha from its second parent when the merge
    # produced a real merge commit. A squash or fast-forward merge has no second parent, so the hydrated sha
    # stays at the promoter's last snapshot and may be stale, as may the recorded commit statuses.
    - active:
        dry:
          sha: "1111111111111111111111111111111111111111"
      proposed:
        hydrated:
          sha: "2222222222222222222222222222222222222222"
        commitStatuses:
          - key: example-key
            phase: success
      pullRequest:
        id: "848"
        state: merged
        prCreationTime: 2023-09-02T00:00:00Z
        prMergeTime: 2023-09-02T01:00:00Z
        url: https://github.com/org/repo/pull/848
        mergedTargetSha: "4444444444444444444444444444444444444444"
      mergeCommitSnapshotMismatch: true
    # A manual restore of the active branch rather than a merged promotion. The tree (and so active.dry)
    # repeats the version named by restoredFrom; the pull request and commit statuses are copied from that
    # version and describe the original promotion, not the restore.
    - active:
        dry:
          sha: "1111111111111111111111111111111111111111"
      proposed:
        hydrated:
          sha: "2222222222222222222222222222222222222222"
      pullRequest:
        id: "848"
        state: merged
        prMergeTime: 2023-09-03T01:00:00Z
        url: https://github.com/org/repo/pull/848
        mergedTargetSha: "5555555555555555555555555555555555555555"
      restoredFrom: "4444444444444444444444444444444444444444"
