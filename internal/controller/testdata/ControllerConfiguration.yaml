# ControllerConfiguration defines the global settings for all promoter controllers.
# Each controller has its own configuration section with WorkQueue settings that control
# how frequently resources are reconciled, how many can run concurrently, and how
# rate limiting is applied to prevent overwhelming external systems.
apiVersion: promoter.argoproj.io/v1alpha1
kind: ControllerConfiguration
metadata:
  name: example-controller-configuration
spec:
  # PromotionStrategy controller manages promotion strategies and creates ChangeTransferPolicies
  promotionStrategy:
    workQueue:
      # How often to automatically requeue resources for reconciliation
      requeueDuration: "5m"
      # Maximum number of concurrent reconcile operations for this controller
      maxConcurrentReconciles: 3
      # Rate limiter controls retry behavior for failed reconciliations
      rateLimiter:
        # Exponential backoff: start at 1s, max out at 1 minute
        exponentialFailure:
          baseDelay: "1s"
          maxDelay: "1m"

  # ChangeTransferPolicy controller handles the actual promotion logic and creates PRs
  changeTransferPolicy:
    workQueue:
      requeueDuration: "5m"
      maxConcurrentReconciles: 5
      rateLimiter:
        # MaxOf combiner: use the maximum delay from multiple rate limiters
        # This combines per-item exponential backoff with a global rate limit
        maxOf:
          - exponentialFailure:
              baseDelay: "1s"
              maxDelay: "2m"
          - bucket:
              # Allow 10 operations per second with bursts up to 20
              qps: 10
              bucket: 20

  # PullRequest controller manages pull request lifecycle
  pullRequest:
    # Template data: .ChangeTransferPolicy, .PromotionStrategy. Sprig helpers (e.g. trimSuffix) are available.
    template:
      title: "Promote {{ trunc 7 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }} to `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`"
      description: |
        This PR promotes changes to **`{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`**{{ if .PromotionStrategy }} (PromotionStrategy `{{ .PromotionStrategy.Name }}`){{ end }}.

        ### Deployment commit
        | | Active (deployed) | Proposed |
        |---|---|---|
        | SHA | {{ with .ChangeTransferPolicy.Status.Active.Dry }}{{ if and .RepoURL .Sha }}[{{ trunc 7 .Sha }}]({{ trimSuffix "/" .RepoURL }}/commit/{{ .Sha }}){{ else }}{{ trunc 7 .Sha }}{{ end }}{{ end }} | {{ with .ChangeTransferPolicy.Status.Proposed.Dry }}{{ if and .RepoURL .Sha }}[{{ trunc 7 .Sha }}]({{ trimSuffix "/" .RepoURL }}/commit/{{ .Sha }}){{ else }}{{ trunc 7 .Sha }}{{ end }}{{ end }} |
        | Subject | {{ .ChangeTransferPolicy.Status.Active.Dry.Subject }} | {{ .ChangeTransferPolicy.Status.Proposed.Dry.Subject }} |

        {{- $repo := "" -}}
        {{- $base := "" -}}
        {{- $head := "" -}}
        {{- $activeSubject := "" -}}
        {{- $proposedSubject := "" -}}
        {{- with index .ChangeTransferPolicy.Status.Active.Dry.References 0 }}{{- with .Commit -}}
        {{- $base = .Sha -}}{{- $activeSubject = .Subject -}}{{- if .RepoURL -}}{{- $repo = .RepoURL -}}{{- end -}}
        {{- end -}}{{- end -}}
        {{- with index .ChangeTransferPolicy.Status.Proposed.Dry.References 0 }}{{- with .Commit -}}
        {{- $head = .Sha -}}{{- $proposedSubject = .Subject -}}{{- if and (not $repo) .RepoURL -}}{{- $repo = .RepoURL -}}{{- end -}}
        {{- end -}}{{- end -}}
        {{- if or $base $head }}

        ### Code reference
        {{- if $base }}
        **Active:** {{ if and $repo $base }}[{{ trunc 7 $base }}]({{ trimSuffix "/" $repo }}/commit/{{ $base }}){{ else }}{{ trunc 7 $base }}{{ end }} — {{ $activeSubject }}
        {{- end }}
        {{- if $head }}
        **Proposed:** {{ if and $repo $head }}[{{ trunc 7 $head }}]({{ trimSuffix "/" $repo }}/commit/{{ $head }}){{ else }}{{ trunc 7 $head }}{{ end }} — {{ $proposedSubject }}
        {{- end }}
        {{- if and $repo $base $head }}
        **Diff:** [{{ trunc 7 $base }}...{{ trunc 7 $head }}]({{ trimSuffix "/" $repo }}/compare/{{ $base }}...{{ $head }})
        {{- end }}
        {{- end }}

        {{- if .PromotionStrategy.Status.Environments }}
        ### Promotion pipeline
        {{- range .PromotionStrategy.Status.Environments }}
        - `{{ .Branch }}`{{ if eq .Branch $.ChangeTransferPolicy.Spec.ActiveBranch }} **(this PR)**{{ end }}{{ if .PullRequest.Url }} — [PR #{{ .PullRequest.ID }}]({{ .PullRequest.Url }}){{ end }}
        {{- end }}
        {{- end }}
    workQueue:
      requeueDuration: "5m"
      maxConcurrentReconciles: 3
      rateLimiter:
        # FastSlow: retry quickly for the first 3 attempts, then slow down
        # Good for handling transient SCM API errors
        fastSlow:
          fastDelay: "500ms"
          slowDelay: "30s"
          maxFastAttempts: 3

  # CommitStatus controller updates commit status based on policies
  commitStatus:
    workQueue:
      requeueDuration: "2m"
      maxConcurrentReconciles: 5
      rateLimiter:
        exponentialFailure:
          baseDelay: "500ms"
          maxDelay: "1m"

  # ArgoCDCommitStatus controller syncs ArgoCD application status to commit statuses
  argocdCommitStatus:
    watchLocalApplications: true
    workQueue:
      requeueDuration: "5m"
      maxConcurrentReconciles: 10
      rateLimiter:
        # Bucket rate limiter: control overall request rate to external APIs
        bucket:
          qps: 20
          bucket: 50

  # TimedCommitStatus controller enforces soak-time gates via CommitStatus resources
  timedCommitStatus:
    workQueue:
      requeueDuration: "1m"
      maxConcurrentReconciles: 5
      rateLimiter:
        exponentialFailure:
          baseDelay: "500ms"
          maxDelay: "1m"

  # GitCommitStatus controller evaluates commit expressions and creates CommitStatus resources
  gitCommitStatus:
    workQueue:
      requeueDuration: "2m"
      maxConcurrentReconciles: 5
      rateLimiter:
        exponentialFailure:
          baseDelay: "500ms"
          maxDelay: "1m"

  # WebRequestCommitStatus controller runs HTTP requests and reports commit status from response
  webRequestCommitStatus:
    workQueue:
      requeueDuration: "2m"
      maxConcurrentReconciles: 5
      rateLimiter:
        exponentialFailure:
          baseDelay: "500ms"
          maxDelay: "1m"

  # ScheduledCommitStatus controller gates promotions on cron-based time windows
  scheduledCommitStatus:
    workQueue:
      requeueDuration: "5m"
      maxConcurrentReconciles: 5
      rateLimiter:
        exponentialFailure:
          baseDelay: "500ms"
          maxDelay: "1m"
