apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default: built-in serving certs via github.com/open-policy-agent/cert-controller
# (no cert-manager dependency, nothing to run after applying).
#
# The certs are issued and rotated by the controller-manager, not by the apiserver: with
# --apiserver-cert-rotation it generates a self-signed CA and serving cert, writes them into
# the (initially empty) promoter-apiserver-serving-cert Secret, injects the CA into the
# APIService .spec.caBundle, and keeps both rotated. This overlay ships that Secret and
# makes the apiserver wait for it to be mounted at /serving-certs before it starts serving.
# The apiserver needs no Secret permissions.
#
# The controller-manager side is the ../certs-builtin-controller component, which the
# release-combined-builtin overlays include. If you apply this overlay on its own, also
# run the controller with --apiserver-cert-rotation and the RBAC in
# ../certs-builtin-controller/rbac.yaml.

resources:
  - ../base
  - serving_cert_secret.yaml

patches:
  - path: deployment_cert_rotation_patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: promoter-apiserver
