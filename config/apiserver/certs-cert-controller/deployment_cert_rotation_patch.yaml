# Enable the built-in cert-controller. It writes tls.crt/tls.key into the
# promoter-apiserver-serving-cert Secret, which the base Deployment mounts at
# /serving-certs (the directory of --tls-cert-file/--tls-private-key-file).
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --cert-rotation
# On first install the apiserver only starts serving once kubelet has projected the
# freshly-populated Secret into the pod, which can take a minute or more. Give it up to
# 5 minutes before the liveness probe takes over.
- op: add
  path: /spec/template/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /livez
      port: https
      scheme: HTTPS
    periodSeconds: 5
    failureThreshold: 60
