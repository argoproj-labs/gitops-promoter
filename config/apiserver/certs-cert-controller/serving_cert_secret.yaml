# Populated and rotated by the apiserver's built-in cert-controller (--cert-rotation).
# cert-controller only updates this Secret, so it must exist up front. It is intentionally
# empty: re-applying this manifest does not clear the generated data. If you manage the
# install with a GitOps tool, ignore differences on this Secret's .data.
apiVersion: v1
kind: Secret
metadata:
  name: promoter-apiserver-serving-cert
  namespace: promoter-system
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: kustomize
type: Opaque
