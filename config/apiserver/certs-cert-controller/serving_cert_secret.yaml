# Populated and rotated by the controller-manager (--apiserver-cert-rotation).
# cert-controller only updates this Secret, so it must exist up front. It is intentionally
# empty: .data is owned by the promoter-apiserver-cert-rotator field manager, so re-applying
# this manifest (client-side or server-side apply) does not clear the generated data.
apiVersion: v1
kind: Secret
metadata:
  name: promoter-apiserver-serving-cert
  namespace: promoter-system
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: kustomize
type: Opaque
