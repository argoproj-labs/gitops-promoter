apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same as release-combined-builtin, but with the fully isolated controller (config/namespaced).
# Builds the published install-with-dashboard-namespaced.yaml. The dashboard apiserver reads
# only promoter-system but still uses cluster-scoped delegated authentication, and the
# controller-manager needs cluster-scoped access to the dashboard APIService to inject the
# caBundle.

resources:
  - ../../namespaced
  - ../certs-builtin

components:
  - ../namespaced-rbac
  - ../certs-builtin-controller

images:
  - name: quay.io/argoprojlabs/gitops-promoter
