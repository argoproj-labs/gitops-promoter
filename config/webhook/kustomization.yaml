apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Validating admission webhook for KubernetesResourceCommitStatus, served by the controller. It checks a gate's
# template and expressions against the created kind's schema when the gate is applied. The controller generates
# and rotates the serving certificate itself (open-policy-agent/cert-controller): it fills the Secret below and
# injects the CA into the ValidatingWebhookConfiguration's caBundle, so no cert-manager or manual certificate is
# needed. Included by config/default; see docs/advanced-usage/admission-webhook.md.
resources:
  - manifests.yaml
  - service.yaml
  - cert_secret.yaml

configurations:
  - kustomizeconfig.yaml
