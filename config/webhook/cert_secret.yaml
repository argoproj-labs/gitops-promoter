# Filled in and rotated by the controller (see --webhook-cert-secret). Shipping it empty means the controller only
# needs permission to update this one Secret, not to create Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: kustomize
type: Opaque
