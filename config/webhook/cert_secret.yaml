# Filled in and rotated by the controller (see --webhook-cert-secret). Shipping it empty means the controller only
# needs permission to update this one Secret, not to create Secrets. The controller writes its data under the field
# manager promoter-webhook-cert-rotator, so GitOps re-applies of this empty Secret leave the generated data alone.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: promoter
type: Opaque
