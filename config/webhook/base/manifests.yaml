---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-promoter-argoproj-io-v1alpha1-kubernetesresourcecommitstatus
  failurePolicy: Fail
  name: vkubernetesresourcecommitstatus.promoter.argoproj.io
  rules:
  - apiGroups:
    - promoter.argoproj.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kubernetesresourcecommitstatuses
  sideEffects: None
  timeoutSeconds: 10
