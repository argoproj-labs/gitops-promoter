# This patch inject a sidecar container which is a HTTP proxy for the
# controller manager, it performs RBAC authorization against the Kubernetes API using SubjectAccessReviews.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        image: quay.io/argoprojlabs/gitops-promoter:latest
        env:
          # Must match the metrics-reader ServiceAccount's actual metadata.name
          # (config/rbac/metrics_reader_service_account.yaml) after this file's own
          # namePrefix/nameSuffix is applied - "promoter-" per this kustomization's namePrefix.
          - name: METRICS_TOKEN_SERVICE_ACCOUNT
            value: promoter-metrics-reader
        args:
          - "--health-probe-bind-address=:8081"
          - "--metrics-secure=true"
          - "--metrics-bind-address=:8443"
          - "--metrics-token-service-account=$(METRICS_TOKEN_SERVICE_ACCOUNT)"
          - "--leader-elect"
        ports:
          - containerPort: 8443
            protocol: TCP
            name: https
