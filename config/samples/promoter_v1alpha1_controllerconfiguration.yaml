apiVersion: promoter.argoproj.io/v1alpha1
kind: ControllerConfiguration
metadata:
  labels:
    app.kubernetes.io/name: promoter
    app.kubernetes.io/managed-by: kustomize
  name: controller-configuration
spec:
  pullRequest:
    template:
      title: "Promote {{ with .ChangeTransferPolicy.Spec.ActivePath }}`{{ . }}` {{ end }}({{ trunc 5 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}) to `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`"
      description: |
        See the default template in config/config/controllerconfiguration.yaml for the full
        dashboard-style description (deployment commits, code-reference diffs, promotion pipeline).
        Template data: .ChangeTransferPolicy, .PromotionStrategy. Sprig helpers such as trimSuffix are available.
