apiVersion: promoter.argoproj.io/v1alpha1
kind: KubernetesResourceCommitStatus
metadata:
  labels:
    app.kubernetes.io/name: promoter
    app.kubernetes.io/managed-by: kustomize
  name: kubernetesresourcecommitstatus-sample
spec:
  key: smoke-test
  promotionStrategyRef:
    name: promotionstrategy-sample
  reportOn: proposed
  # Requires batch/v1 Job in ControllerConfiguration.spec.kubernetesResourceCommitStatus.resources.
  templateRef:
    apiVersion: batch.templates.promoter.argoproj.io/v1
    kind: Job
    name: smoke-test
  lifecycle:
    mode: PerSha
    historyLimit: 1
  phase:
    expression: |
      any(Resource.status?.conditions ?? [], {.type == 'Complete' && .status == 'True'})
        ? {phase: 'success'}
        : any(Resource.status?.conditions ?? [], {.type == 'Failed' && .status == 'True'})
          ? {phase: 'failure', description: 'Smoke test is failing'}
          : false
