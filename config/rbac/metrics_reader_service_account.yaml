# Dedicated, minimally-privileged identity used only to mint the bearer token Prometheus
# presents to this manager's secure /metrics endpoint (see internal/metrics/token_minter.go).
# Deliberately separate from the controller-manager ServiceAccount (service_account.yaml): that
# identity has broad RBAC for reconciling this project's CRDs, so minting its token for Prometheus
# to hold would mean a leaked scrape credential grants far more than "can read /metrics". This
# ServiceAccount has only the metrics-reader ClusterRole bound to it (metrics_reader_role_binding.yaml)
# and is never used to run a Pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: serviceaccount
    app.kubernetes.io/instance: metrics-reader
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: promoter
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: kustomize
  name: metrics-reader
  namespace: system
