---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: revertactivecommits.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: RevertActiveCommit
    listKind: RevertActiveCommitList
    plural: revertactivecommits
    singular: revertactivecommit
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.promotionStrategyRef.name
      name: Strategy
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .spec.sha
      name: Sha
      priority: 1
      type: string
    - jsonPath: .status.activeSha
      name: Active Sha
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RevertActiveCommit restores one environment's active branch to a previously hydrated commit and records
          the dry SHA that was on the active branch then, so that dry SHA is not promoted again.
          Creating the resource is the authorization boundary: whoever can create a RevertActiveCommit in the
          strategy's namespace can restore that environment, and the controller's git credentials perform the push.
          The controller sets the environment's ChangeTransferPolicy as owner, so deleting the policy removes its reverts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RevertActiveCommitSpec defines the desired state of RevertActiveCommit. It is immutable: the restore runs
              once, and status.blockedDrySha is read from the active tip it moved off of, so pointing an
              existing RevertActiveCommit at a different sha, strategy, or branch would lose track of what it
              reverted. To restore something else, create a new RevertActiveCommit.
            properties:
              branch:
                description: |-
                  Branch is the environment branch on that PromotionStrategy to restore. The controller resolves
                  it to the ChangeTransferPolicy the strategy created for this branch, which supplies the
                  repository, the active and proposed branches, and activePath.
                maxLength: 100
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: branch must not start with '-'
                  rule: '!self.startsWith(''-'')'
                - message: branch must not contain ':'
                  rule: '!self.contains('':'')'
                - message: branch must not contain '..'
                  rule: '!self.contains(''..'')'
              promotionStrategyRef:
                description: PromotionStrategyRef selects the PromotionStrategy that
                  owns the environment to restore.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              sha:
                description: |-
                  Sha is the hydrated commit to restore onto the active branch. It must already be in the active
                  branch's history (the tip or one of its ancestors); any other commit is refused. A commit that
                  carries Promoter-restored-from is itself a restore and is refused. The
                  controller writes a new commit (the commit's tree, or only activePath when the policy sets
                  one) parented on the current active tip and records a promotion-history note with
                  Promoter-restored-from. When the active branch already has that content, nothing is written.
                  The proposed branch is left as the hydrator wrote it. The ChangeTransferPolicy does not open
                  a promotion pull request that would put the active branch's dry SHA back. A pull request
                  for a different proposed dry SHA may open, but nothing is auto-merged while this
                  RevertActiveCommit exists. Deleting it lifts that hold but does not by itself propose the
                  reverted change again; see status.blockedDrySha.
                  The restore runs once. Later promotions are left alone.
                maxLength: 64
                minLength: 40
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                type: string
            required:
            - branch
            - promotionStrategyRef
            - sha
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new RevertActiveCommit to restore
                a different commit, strategy, or branch
              rule: self == oldSelf
          status:
            description: RevertActiveCommitStatus defines the observed state of RevertActiveCommit.
            properties:
              activeSha:
                description: ActiveSha is the commit on the active branch after a
                  successful restore.
                maxLength: 64
                minLength: 40
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                type: string
              blockedDrySha:
                description: |-
                  BlockedDrySha is the dry SHA read from hydrator.metadata on the active tip that this restore
                  moved off of. The ChangeTransferPolicy does not open a promotion pull request while its
                  proposed dry SHA still equals this value, so the reverted change is not put back. A different
                  proposed dry SHA may open a pull request, but nothing is auto-merged while this RevertActiveCommit
                  exists. Empty when that active tip had no hydrator.metadata, or when the active branch already
                  had spec.sha's content so nothing was moved off it. Deleting the RevertActiveCommit lifts
                  this block, but a promotion pull request only opens when the proposed branch has a commit the
                  active branch does not already contain. The restore commit is parented on the tip it moved
                  off of, so when that tip already contains the proposed commit (a merge-commit promotion),
                  this dry SHA is not proposed again until the hydrator writes a new commit to the proposed branch.
                maxLength: 64
                minLength: 40
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
              restoredFrom:
                description: |-
                  RestoredFrom is the spec.sha this status applied. It is written in the same status update as
                  activeSha and blockedDrySha, so it alone marks the restore as done. While it matches spec.sha
                  the controller does not restore again, so a later promotion is not overwritten on resync.
                maxLength: 64
                minLength: 40
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
