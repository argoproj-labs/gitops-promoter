---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: kubernetesresourcecommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: KubernetesResourceCommitStatus
    listKind: KubernetesResourceCommitStatusList
    plural: kubernetesresourcecommitstatuses
    singular: kubernetesresourcecommitstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.key
      name: Key
      type: string
    - jsonPath: .spec.promotionStrategyRef.name
      name: PromotionStrategy
      type: string
    - jsonPath: .spec.template.kind
      name: Kind
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KubernetesResourceCommitStatus is the Schema for the kubernetesresourcecommitstatuses
          API
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#kubernetesresourcecommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KubernetesResourceCommitStatus
            properties:
              description:
                description: |-
                  Description is the human-readable commit status description shown in the SCM provider. Supports the same
                  ${ } expressions as Template, with these additional variables:
                    - Phase: the phase computed this reconcile (pending/success/failure)
                    - Resource: the live resource as a map (nil when it does not exist)
                    - ResourceName and ResourceKind: the name and Kind of the created resource
                    - ExpressionDescription and ExpressionUrl: the description and url returned by spec.phase.expression, if any
                  When empty, the description returned by spec.phase.expression is used, falling back to a message such as
                  "Waiting for Job my-job" or "Job my-job reports success".
                type: string
              key:
                description: |-
                  Key is the commit status key. It is matched against the PromotionStrategy's proposedCommitStatuses or
                  activeCommitStatuses to determine which environments this gate applies to, and it is used as the
                  promoter.argoproj.io/commit-status label and in the CommitStatus name shown in the SCM.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              lifecycle:
                default: {}
                description: |-
                  Lifecycle controls whether a new resource is created per SHA (default) or a single resource per environment
                  is updated in place, and how many per-SHA resources are retained. See KubernetesResourceLifecycle.
                properties:
                  historyLimit:
                    description: |-
                      HistoryLimit is the number of per-SHA resources retained per environment, including the current one.
                      Older resources are deleted once the current one exists. Defaults to 1 when omitted (no schema default,
                      so the field can stay unset for mode InPlace). Only valid with mode PerSha.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  mode:
                    default: PerSha
                    description: Mode is PerSha (default) or InPlace. See KubernetesResourceLifecycleMode.
                    enum:
                    - PerSha
                    - InPlace
                    type: string
                type: object
                x-kubernetes-validations:
                - message: historyLimit is only valid with mode PerSha
                  rule: '!has(self.historyLimit) || !has(self.mode) || self.mode ==
                    ''PerSha'''
              phase:
                description: |-
                  Phase holds the expr expression that computes the commit status phase from the live resource.
                  See KubernetesResourcePhaseSpec.
                properties:
                  expression:
                    description: "Expression is an expr (https://expr-lang.org) expression
                      evaluated on every reconcile while the\ncreated resource exists.
                      Available variables:\n  - Resource (map): the live resource,
                      including status. Guard optional fields with ?. and ??,\n    for
                      example Resource.status?.conditions ?? [], because member access
                      through nil is an error.\n  - Branch (string), Sha (string),
                      ReportOn (string)\n  - Environment: the PromotionStrategy status
                      entry for Branch\n  - PromotionStrategy: the full PromotionStrategy
                      spec and status\n  - KubernetesResourceCommitStatus: this gate
                      (snapshot from the previous reconcile)\n\nReturn values:\n  -
                      a boolean: true → success, false → pending\n  - an object {
                      phase, description?, url? } where phase is \"success\", \"pending\",
                      or \"failure\"\n    (an omitted or empty phase means \"pending\")\nAny
                      other return type, or an unrecognized phase string, fails the
                      reconcile.\n\nExample for a batch/v1 Job:\n\n\tany(Resource.status?.conditions
                      ?? [], {.type == 'Complete' && .status == 'True'})\n\t  ? {phase:
                      'success'}\n\t  : any(Resource.status?.conditions ?? [], {.type
                      == 'Failed' && .status == 'True'})\n\t    ? {phase: 'failure',
                      description: 'Smoke test is failing'}\n\t    : false"
                    minLength: 1
                    type: string
                required:
                - expression
                type: object
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef references the PromotionStrategy this gate applies to.
                  The controller gates every environment of the referenced PromotionStrategy where spec.key matches
                  an entry in PromotionStrategy.spec.proposedCommitStatuses / activeCommitStatuses (global) or the
                  environment's own proposedCommitStatuses / activeCommitStatuses.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              publishTo:
                default:
                - scm
                description: |-
                  PublishTo is copied to spec.publishTo on each CommitStatus this controller creates.
                  - "scm": the CommitStatus controller posts them to the SCM provider
                  The default is ["scm"]. An empty list keeps them in Kubernetes and does not post them to the SCM.
                items:
                  description: CommitStatusPublishTo is one destination a commit status
                    can be published to.
                  enum:
                  - scm
                  type: string
                type: array
                x-kubernetes-list-type: set
              reportOn:
                default: proposed
                description: |-
                  ReportOn selects which commit SHA the CommitStatus is reported on and which SHA the resource is created for.
                  - "proposed": the proposed hydrated SHA (default). Use for checks that must pass before a change is promoted.
                  - "active": the active hydrated SHA. Use for checks that run against what is currently live.
                enum:
                - proposed
                - active
                type: string
              template:
                description: |-
                  Template is the Kubernetes object the controller creates for every applicable environment. It must carry
                  apiVersion and kind (a namespaced kind listed in ControllerConfiguration.spec.kubernetesResourceCommitStatus.resources);
                  metadata.name, metadata.namespace, and status are ignored because the controller sets them. metadata.labels and
                  metadata.annotations are kept and merged under the controller's own labels.

                  Any string value may contain expr (https://expr-lang.org) expressions wrapped in ${ }:
                    - A value that is exactly one expression, such as "${ Sha }" or "${ Environment.Proposed.Hydrated.Sha }", is
                      replaced by the expression's result with its type preserved, so integers, booleans, lists, and objects
                      can be computed. A nil result removes the field.
                    - A string with embedded expressions, such as "smoke-${ ShortSha }", concatenates the results as text.
                    - "$${" produces a literal "${".
                  Available variables: Branch, Sha, ShortSha, ReportOn, Environment (the PromotionStrategy status entry for the
                  branch), PromotionStrategy, and KubernetesResourceCommitStatus (this gate, as of the previous reconcile).
                  Everything else is copied verbatim. The rendered object is validated by the API server when it is created.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              url:
                description: |-
                  Url is the commit status target URL shown in the SCM provider. Same ${ } expressions and variables as Description.
                  When empty, the url returned by spec.phase.expression (if any) is used.
                type: string
            required:
            - key
            - phase
            - promotionStrategyRef
            - template
            type: object
          status:
            description: status defines the observed state of KubernetesResourceCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environments:
                description: Environments holds the observed state of each applicable
                  environment.
                items:
                  description: KubernetesResourceCommitStatusEnvironmentStatus is
                    the observed state for one environment branch.
                  properties:
                    branch:
                      description: Branch is the environment branch name.
                      minLength: 1
                      type: string
                    description:
                      description: Description mirrors child CommitStatus.spec.description.
                      type: string
                    lastEvaluationTime:
                      description: LastEvaluationTime is when spec.phase.expression
                        was last evaluated against the live resource.
                      format: date-time
                      type: string
                    phase:
                      description: Phase mirrors child CommitStatus.spec.phase.
                      enum:
                      - pending
                      - success
                      - failure
                      - ""
                      type: string
                    reportedSha:
                      description: |-
                        ReportedSha is the hydrated SHA the child CommitStatus is attached to (CommitStatus.spec.sha).
                        Semantics depend on the parent gate (proposed vs active hydrated SHA).
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    resource:
                      description: Resource identifies the real resource created for
                        this environment and reportedSha.
                      properties:
                        apiVersion:
                          description: APIVersion of the created resource (the real
                            kind, for example batch/v1).
                          type: string
                        kind:
                          description: Kind of the created resource.
                          type: string
                        name:
                          description: Name of the created resource. It lives in the
                            gate's namespace.
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      type: object
                    url:
                      description: Url mirrors child CommitStatus.spec.url.
                      pattern: ^(https?://.*)?$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a valid URL
                        rule: self == '' || isURL(self)
                  required:
                  - branch
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
