---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: validatedcommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: ValidatedCommitStatus
    listKind: ValidatedCommitStatusList
    plural: validatedcommitstatuses
    singular: validatedcommitstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.promotionStrategyRef.name
      name: PromotionStrategy
      type: string
    - jsonPath: .spec.dryBranch
      name: Dry Branch
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ValidatedCommitStatus is the Schema for the validatedcommitstatuses
          API
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#validatedcommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ValidatedCommitStatus
            properties:
              dryBranch:
                description: |-
                  DryBranch is the branch dry commits are pushed to, in the PromotionStrategy's repository. A root
                  environment with validation Automatic follows its head.
                  Must not start with '-', contain ':', or contain '..'.
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: dryBranch must not start with '-'
                  rule: '!self.startsWith(''-'')'
                - message: dryBranch must not contain ':'
                  rule: '!self.contains('':'')'
                - message: dryBranch must not contain '..'
                  rule: '!self.contains(''..'')'
              environments:
                description: |-
                  Environments overrides how individual environments are validated and advanced. An environment of
                  the PromotionStrategy that is not listed uses validation Automatic and advance Immediately. Every
                  branch listed must be an environment of the PromotionStrategy.
                items:
                  description: ValidatedCommitStatusEnvironment sets how one environment
                    is validated and advanced.
                  properties:
                    advance:
                      default: Immediately
                      description: |-
                        Advance says when an automatic validation may move this environment's tag. Immediately (the
                        default), or WhenIdle to wait until the environment has finished what it is promoting. Manual
                        validations always apply immediately.
                      enum:
                      - Immediately
                      - WhenIdle
                      type: string
                    branch:
                      description: |-
                        Branch is the environment's active branch. It must match an environment of the referenced
                        PromotionStrategy.
                        Must not start with '-', contain ':', or contain '..'.
                      maxLength: 100
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: branch must not start with '-'
                        rule: '!self.startsWith(''-'')'
                      - message: branch must not contain ':'
                        rule: '!self.contains('':'')'
                      - message: branch must not contain '..'
                        rule: '!self.contains(''..'')'
                    validation:
                      default: Automatic
                      description: |-
                        Validation says who validates dry commits for this environment. Automatic (the default): the
                        controller, once every environment this one depends on has succeeded on the commit. Manual: a
                        person or CI, through a CommitValidation or a pushed git note.
                      enum:
                      - Automatic
                      - Manual
                      type: string
                  required:
                  - branch
                  type: object
                  x-kubernetes-validations:
                  - message: 'validation Manual cannot be combined with advance WhenIdle:
                      manual validations always apply immediately'
                    rule: '!(has(self.validation) && self.validation == ''Manual''
                      && has(self.advance) && self.advance == ''WhenIdle'')'
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              key:
                description: |-
                  Key is the commit status key this controller writes on each environment's proposed hydrated SHA.
                  The PromotionStrategy controller injects this key onto every ChangeTransferPolicy's proposedCommitStatuses.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters (pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef is a reference to the promotion strategy this gate orders. The environments and
                  their dependencies (dependsOn) come from the PromotionStrategy.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              publishTo:
                default:
                - scm
                description: |-
                  PublishTo is copied to spec.publishTo on each CommitStatus this controller creates.
                  - "scm": the CommitStatus controller posts them to the SCM provider
                  The default is ["scm"]. An empty list keeps them in Kubernetes and does not post them to the SCM.
                  Omitting the field uses the default. Promotion gates use the phase in every case.
                items:
                  description: CommitStatusPublishTo is one destination a commit status
                    can be published to.
                  enum:
                  - scm
                  type: string
                type: array
                x-kubernetes-list-type: set
              url:
                description: |-
                  URL generates the URL to use on the per-environment CommitStatus (SCM details link). Optional; when
                  empty, no URL is set on the child CommitStatus. The template receives .Environment, .Tag,
                  .ValidatedCommitStatus, and .PromotionStrategy.
                properties:
                  options:
                    description: "Options sets options for the template. Options are
                      described by\nstrings, either a simple string or \"key=value\".
                      There can be at\nmost one equals sign in an option string. If
                      the option string\nis unrecognized or otherwise invalid, Option
                      panics.\n\nKnown options:\n\nmissingkey: Control the behavior
                      during execution if a map is\nindexed with a key that is not
                      present in the map.\n\n\t\"missingkey=default\" or \"missingkey=invalid\"\n\t\tThe
                      default behavior: Do nothing and continue execution.\n\t\tIf
                      printed, the result of the index operation is the string\n\t\t\"<no
                      value>\".\n\t\"missingkey=zero\"\n\t\tThe operation returns
                      the zero value for the map type's element.\n\t\"missingkey=error\"\n\t\tExecution
                      stops immediately with an error."
                    items:
                      type: string
                    type: array
                  template:
                    description: |-
                      Template is a Go text template used to generate the CommitStatus URL. A function called
                      urlQueryEscape is available to escape URL query parameters. The template can be configured
                      with options (url.options) to control behavior when a variable is not present.

                      Available template variables depend on the parent resource that embeds URLConfig
                      (ArgoCDCommitStatus or DependentsSuccessfulCommitStatus). See the
                      corresponding gate documentation for the variable set and examples.
                    type: string
                type: object
            required:
            - dryBranch
            - key
            - promotionStrategyRef
            type: object
          status:
            description: status defines the observed state of ValidatedCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dryBranch:
                description: DryBranch is the observed state of spec.dryBranch.
                properties:
                  sha:
                    description: Sha is the head of spec.dryBranch when the controller
                      last reconciled.
                    maxLength: 64
                    pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                    type: string
                required:
                - sha
                type: object
              environments:
                description: Environments reports the tag, validation, and gate state
                  of each environment.
                items:
                  description: ValidatedCommitStatusEnvironmentStatus defines observed
                    state for one environment branch.
                  properties:
                    automaticValidation:
                      description: |-
                        AutomaticValidation is the newest dry commit the controller validated for this environment on its
                        own: the commit it last wrote an automatic validation for or, for an environment that follows the
                        dry branch, the head it last took. The controller validates again once UpstreamCleared is another
                        commit. Omitted for an environment that people validate.
                      properties:
                        sha:
                          description: Sha is the dry commit.
                          maxLength: 64
                          pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                          type: string
                      required:
                      - sha
                      type: object
                    branch:
                      description: Branch is the environment branch name.
                      minLength: 1
                      type: string
                    description:
                      description: Description mirrors child CommitStatus.spec.description.
                      type: string
                    held:
                      description: Held is set only while an automatic validation
                        is waiting to be applied.
                      properties:
                        message:
                          description: Message says what the validation is waiting
                            for.
                          type: string
                        reason:
                          description: |-
                            Reason is Pinned when the commit does not descend from the commit the tag is on, and Busy when the
                            environment advances WhenIdle and is not idle.
                          enum:
                          - Pinned
                          - Busy
                          type: string
                        sha:
                          description: Sha is the validated dry commit that is waiting.
                          maxLength: 64
                          pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                          type: string
                      required:
                      - reason
                      - sha
                      type: object
                    pending:
                      description: Pending is set only while a validated tag move
                        could not be pushed. The controller retries it.
                      properties:
                        message:
                          description: Message is the error from the last attempt
                            to push the tag.
                          type: string
                        sha:
                          description: Sha is the dry commit the tag should point
                            at.
                          maxLength: 64
                          pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                          type: string
                        source:
                          description: |-
                            Source is the kind of validation that asked for the move. It is Manual when a manual validation is
                            part of what moved the tag, also when an automatic one followed it: the move is then made wherever
                            the commit is.
                          enum:
                          - Manual
                          - Automatic
                          - Seeded
                          - External
                          type: string
                      required:
                      - sha
                      - source
                      type: object
                    phase:
                      description: Phase mirrors child CommitStatus.spec.phase.
                      enum:
                      - pending
                      - success
                      - failure
                      - ""
                      type: string
                    reportedSha:
                      description: |-
                        ReportedSha is the hydrated SHA the child CommitStatus is attached to (CommitStatus.spec.sha).
                        Semantics depend on the parent gate (proposed vs active hydrated SHA).
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    successfulShas:
                      description: |-
                        SuccessfulShas lists the dry commits this environment succeeded on, newest first, capped at 10.
                        An environment succeeds on a commit when the commit is live in it, or changed nothing for it, and
                        every active commit status passes.
                      items:
                        description: ValidatedCommitStatusSuccessfulSha is a dry commit
                          an environment succeeded on.
                        properties:
                          sha:
                            description: Sha is the dry commit.
                            maxLength: 64
                            pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                            type: string
                          time:
                            description: Time is when the controller first saw the
                              environment successful on the commit.
                            format: date-time
                            type: string
                        required:
                        - sha
                        - time
                        type: object
                      maxItems: 10
                      type: array
                      x-kubernetes-list-type: atomic
                    tag:
                      description: |-
                        Tag is the environment's tag as last read from the repository. Omitted until the controller has
                        looked at the tag, and while a tag it tried to create could not be pushed.
                      properties:
                        movedAt:
                          description: MovedAt is when the controller moved the tag,
                            or noticed that it had been moved.
                          format: date-time
                          type: string
                        name:
                          description: |-
                            Name is the tag's name: <environment branch>-tag, or <environment branch>-tag/<activePath> when the
                            environment has an activePath.
                          minLength: 1
                          type: string
                        sha:
                          description: Sha is the dry commit the tag points at. Omitted
                            while the tag does not exist.
                          maxLength: 64
                          pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                          type: string
                        source:
                          description: Source says what last moved the tag. External
                            means it was moved by hand.
                          enum:
                          - Manual
                          - Automatic
                          - Seeded
                          - External
                          type: string
                      required:
                      - name
                      type: object
                    upstreamCleared:
                      description: |-
                        UpstreamCleared is the newest dry commit every environment this one depends on has succeeded on.
                        For an environment with no upstreams it is the head of the dry branch. It tells an approver what
                        is ready to validate for a Manual environment.
                      properties:
                        sha:
                          description: Sha is the dry commit.
                          maxLength: 64
                          pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                          type: string
                      required:
                      - sha
                      type: object
                    url:
                      description: Url mirrors child CommitStatus.spec.url.
                      pattern: ^(https?://.*)?$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a valid URL
                        rule: self == '' || isURL(self)
                  required:
                  - branch
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
              validationsCursor:
                description: |-
                  ValidationsCursor is the last commit of refs/notes/promoter.validations whose validations the
                  controller has applied. Omitted while that ref does not exist.
                maxLength: 64
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
