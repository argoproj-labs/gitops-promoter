---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: dryshavalidationcommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: DryShaValidationCommitStatus
    listKind: DryShaValidationCommitStatusList
    plural: dryshavalidationcommitstatuses
    singular: dryshavalidationcommitstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.key
      name: Key
      type: string
    - jsonPath: .spec.promotionStrategyRef.name
      name: Strategy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DryShaValidationCommitStatus is the Schema for the dryshavalidationcommitstatuses
          API
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#dryshavalidationcommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DryShaValidationCommitStatus
            properties:
              environments:
                description: |-
                  Environments declares the promotion dependency graph. Each entry names an environment branch
                  and the lower branches it depends on; a dry commit validated in any of those (transitively)
                  satisfies this environment. An entry with no dependsOn is a graph root and always passes.
                  When omitted, a linear chain is derived from the referenced PromotionStrategy's
                  spec.environments order (each environment depends on the one before it).
                  The graph must be acyclic; cycles and references to unknown branches are rejected.
                items:
                  description: DryShaValidationEnvironment is a single node in the
                    promotion dependency graph.
                  properties:
                    branch:
                      description: |-
                        Branch is the name of the active branch for the environment. It must match a branch declared
                        in the referenced PromotionStrategy's environments.
                        Must not start with '-', contain ':', or contain '..'.
                      maxLength: 100
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: branch must not start with '-'
                        rule: '!self.startsWith(''-'')'
                      - message: branch must not contain ':'
                        rule: '!self.contains('':'')'
                      - message: branch must not contain '..'
                        rule: '!self.contains(''..'')'
                    dependsOn:
                      description: |-
                        DependsOn is the list of lower branches this environment promotes after. The environment is
                        eligible once its target dry commit has been validated in any of them, transitively.
                        An empty or omitted list makes this environment a root of the graph.
                        Each item must not start with '-', contain ':', or contain '..'.
                      items:
                        maxLength: 100
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: branch must not start with '-'
                          rule: '!self.startsWith(''-'')'
                        - message: branch must not contain ':'
                          rule: '!self.contains('':'')'
                        - message: branch must not contain '..'
                          rule: '!self.contains(''..'')'
                      maxItems: 100
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - branch
                  type: object
                  x-kubernetes-validations:
                  - message: branch cannot depend on itself
                    rule: '!has(self.dependsOn) || self.dependsOn.all(d, d != self.branch)'
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              key:
                description: |-
                  Key is the commit status key referenced in the PromotionStrategy's proposedCommitStatuses.
                  It must match a key declared there so the gate this controller produces is enforced.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters (pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              lookbackLimit:
                default: 10
                description: |-
                  LookbackLimit is how many first-parent commits to scan on each upstream environment's active
                  branch when looking for the dry commit. A dry commit promoted longer ago than this many
                  promotions in every upstream reads as unvalidated, and the gate stays pending.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef is a reference to the PromotionStrategy this gate applies to. The
                  controller watches it and, for each environment, reports whether the dry commit being
                  promoted has already been validated in a lower environment.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              url:
                description: |-
                  URL generates the URL to use on the per-environment CommitStatus (SCM details link), for
                  example a link into the Promoter UI that highlights this environment's upstreams.
                  Optional; when empty, no URL is set on the child CommitStatus. The template receives
                  .Environment, .DryShaValidationCommitStatus, .PromotionStrategy, .DependsOn and
                  .DependsOnQuery (see controller docs).
                properties:
                  options:
                    description: "Options sets options for the template. Options are
                      described by\nstrings, either a simple string or \"key=value\".
                      There can be at\nmost one equals sign in an option string. If
                      the option string\nis unrecognized or otherwise invalid, Option
                      panics.\n\nKnown options:\n\nmissingkey: Control the behavior
                      during execution if a map is\nindexed with a key that is not
                      present in the map.\n\n\t\"missingkey=default\" or \"missingkey=invalid\"\n\t\tThe
                      default behavior: Do nothing and continue execution.\n\t\tIf
                      printed, the result of the index operation is the string\n\t\t\"<no
                      value>\".\n\t\"missingkey=zero\"\n\t\tThe operation returns
                      the zero value for the map type's element.\n\t\"missingkey=error\"\n\t\tExecution
                      stops immediately with an error."
                    items:
                      type: string
                    type: array
                  template:
                    description: |-
                      Template is a Go text template used to generate the CommitStatus URL. A function called
                      urlQueryEscape is available to escape URL query parameters. The template can be configured
                      with options (url.options) to control behavior when a variable is not present.

                      Available template variables depend on the parent resource that embeds URLConfig
                      (ArgoCDCommitStatus, DAGCommitStatus, or PreviousEnvironmentCommitStatus). See the
                      corresponding gate documentation for the variable set and examples.
                    type: string
                type: object
            required:
            - key
            - promotionStrategyRef
            type: object
          status:
            description: status defines the observed state of DryShaValidationCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environments:
                description: |-
                  Environments reports, per environment, the outcome of the most recent evaluation. The gate
                  itself is enforced through the generated per-environment CommitStatus resources; this is the
                  at-a-glance record of why each one is in the phase it is, because the evidence behind the
                  decision lives in git history rather than in any API object.
                items:
                  description: DryShaValidationEnvironmentStatus is the most recent
                    gate evaluation for one environment.
                  properties:
                    branch:
                      description: Branch is the environment's active branch.
                      maxLength: 100
                      minLength: 1
                      type: string
                    commitsScanned:
                      description: |-
                        CommitsScanned is how many first-parent commits were walked in the upstream environments on
                        the last evaluation, bounded by spec.lookbackLimit. It tells "not validated yet" apart from
                        "validated, but it aged out of the lookback window".
                      format: int32
                      type: integer
                    lastEvaluationTime:
                      description: LastEvaluationTime is when this environment was
                        last evaluated.
                      format: date-time
                      type: string
                    phase:
                      description: Phase mirrors the phase written to this environment's
                        generated CommitStatus.
                      enum:
                      - pending
                      - success
                      - failure
                      type: string
                    targetDrySha:
                      description: |-
                        TargetDrySha is the dry commit this environment is currently promoting, resolved from the
                        hydrator note and falling back to the proposed dry SHA. Empty when nothing is in flight.
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    validatedAt:
                      description: |-
                        ValidatedAt is the commit time of the merge commit that made TargetDrySha active in
                        ValidatedIn. Empty while the gate is pending.
                      format: date-time
                      type: string
                    validatedIn:
                      description: |-
                        ValidatedIn is the lower environment branch whose history proved TargetDrySha was active and
                        healthy there. Empty while the gate is pending.
                      maxLength: 100
                      type: string
                  required:
                  - branch
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
