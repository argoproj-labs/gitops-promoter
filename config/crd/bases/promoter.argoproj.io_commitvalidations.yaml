---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: commitvalidations.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: CommitValidation
    listKind: CommitValidationList
    plural: commitvalidations
    singular: commitvalidation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.promotionStrategyRef.name
      name: PromotionStrategy
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .spec.sha
      name: Sha
      type: string
    - jsonPath: .status.request.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CommitValidation is the Schema for the commitvalidations API. It submits manual validations for one
          environment of a PromotionStrategy and shows that environment's validation history.

          The work queue coalesces events, so a second change to spec.sha before the first was handled would be
          lost. The rules below make the API server reject it instead.
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#commitvalidation
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CommitValidation
            properties:
              branch:
                description: |-
                  Branch is the environment branch on that PromotionStrategy that this resource validates commits for.
                  Must not start with '-', contain ':', or contain '..'.
                maxLength: 100
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: branch must not start with '-'
                  rule: '!self.startsWith(''-'')'
                - message: branch must not contain ':'
                  rule: '!self.contains('':'')'
                - message: branch must not contain '..'
                  rule: '!self.contains(''..'')'
              promotionStrategyRef:
                description: PromotionStrategyRef selects the PromotionStrategy that
                  owns the environment.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              reason:
                description: |-
                  Reason is copied into the validation, for example a change ticket. It belongs to sha and can only
                  be set or changed together with it.
                maxLength: 1024
                minLength: 1
                type: string
              sha:
                description: |-
                  Sha is the dry commit to validate for the environment. It may be any commit in the repository, on
                  or off the dry branch. Omit it to use the resource only to view the environment's validation
                  history. It cannot change until status.request reports the current value as handled.
                maxLength: 64
                minLength: 40
                pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                type: string
            required:
            - branch
            - promotionStrategyRef
            type: object
            x-kubernetes-validations:
            - message: promotionStrategyRef and branch are immutable; create a new
                CommitValidation for a different strategy or environment
              rule: self.promotionStrategyRef == oldSelf.promotionStrategyRef && self.branch
                == oldSelf.branch
            - message: reason requires sha
              rule: '!has(self.reason) || has(self.sha)'
            - message: reason cannot change while sha stays the same; sha and reason
                are one request
              rule: '!has(oldSelf.sha) || !has(self.sha) || self.sha != oldSelf.sha
                || (has(self.reason) == has(oldSelf.reason) && (!has(self.reason)
                || self.reason == oldSelf.reason))'
          status:
            description: status defines the observed state of CommitValidation
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              history:
                description: |-
                  History lists the environment's validations, newest first, capped at 20. It is rebuilt from the
                  git notes under refs/notes/promoter.validations, which are the record.
                items:
                  description: CommitValidationHistoryEntry is one validation of the
                    environment, read back from the repository.
                  properties:
                    reason:
                      description: Reason is the reason given with the validation,
                        if any.
                      type: string
                    sha:
                      description: Sha is the validated dry commit.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                      type: string
                    source:
                      description: |-
                        Source says how the validation was made: through a CommitValidation (Resource), by the ordering
                        controller once upstream environments succeeded (Automatic), or as a pushed git note (Git).
                      enum:
                      - Resource
                      - Automatic
                      - Git
                      type: string
                    validatedAt:
                      description: ValidatedAt is when the validation was made.
                      format: date-time
                      type: string
                    validatedBy:
                      description: |-
                        ValidatedBy names who or what validated the commit. For a pushed note without one, it is the
                        author of the notes commit.
                      type: string
                  required:
                  - sha
                  - source
                  - validatedAt
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
              request:
                description: |-
                  Request is the outcome for the SHA currently in spec. Omitted while spec.sha is not set or has
                  not been handled yet.
                properties:
                  handledAt:
                    description: HandledAt is when the controller recorded or rejected
                      the request.
                    format: date-time
                    type: string
                  message:
                    description: Message explains a rejection.
                    type: string
                  phase:
                    description: Phase is Recorded when the validation was written
                      to the repository, and Rejected when it was not.
                    enum:
                    - Recorded
                    - Rejected
                    type: string
                  sha:
                    description: Sha is the spec.sha this outcome is for.
                    maxLength: 64
                    pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                    type: string
                required:
                - handledAt
                - phase
                - sha
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.sha cannot change until status.request reports the current
            SHA as handled
          rule: '!has(oldSelf.spec.sha) || (has(self.spec.sha) && self.spec.sha ==
            oldSelf.spec.sha) || (has(oldSelf.status) && has(oldSelf.status.request)
            && oldSelf.status.request.sha == oldSelf.spec.sha)'
        - message: spec.sha cannot be set until status.request for the previous SHA
            has been cleared
          rule: has(oldSelf.spec.sha) || !has(self.spec.sha) || !has(oldSelf.status)
            || !has(oldSelf.status.request)
    served: true
    storage: true
    subresources:
      status: {}
