# A pull request commit receives three coverage reports: integration and ui from ci.yaml, and e2e from
# ci-e2e.yaml (its matrix jobs upload under one name and flag, which Codecov counts as one report). The
# e2e workflow usually finishes first, and without this Codecov posted the PR comment on the first
# report and never refreshed it, so the comment showed e2e-only coverage (about 49%) against a complete
# base (about 85%). Wait for all three before commenting. If a report is added or removed, update this
# count: a value above the number of reports means no comment is ever posted. The status checks were
# never affected; they use the merged report.
comment:
  after_n_builds: 3

coverage:
  status:
    # allow test coverage to drop by 0.1%, assume that it's typically due to CI problems
    patch:
      default:
        threshold: 0.1
    project:
      default:
        threshold: 0.1
      # Merged coverage of UI sources. The Vitest upload is also flagged `ui`
      # (see flag_management) so the PR comment can show that suite on its own.
      # No component: it would repeat this same path filter.
      ui:
        target: auto
        threshold: 0.1
        paths:
          - ui/dashboard
          - ui/extension
          - ui/components-lib
          - ui/shared
# Flags label an upload. `ui` is only the Vitest lcov; `integration` is the Go profile.
# Paths limit the ui flag percentage to UI sources. No per-flag statuses: the project
# status above is already the check for those paths.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: ui
      carryforward: false
      paths:
        - ui/dashboard
        - ui/extension
        - ui/components-lib
        - ui/shared
ignore:
  - 'api/v1alpha1'
  - 'applyconfiguration'
  - 'test'
  - 'cmd'
  - 'config'
  - 'dist'
  - 'hack'
  - 'internal/scms/mock'
  - 'internal/controller/testutils'
  # The dashboard HTTP server (gitops-promoter dashboard) is not started by the e2e suite, so this
  # package only shows up, at zero hits, once the manager image is built with -cover.
  # TODO: exercise internal/webserver in the e2e tests, then drop this ignore.
  - 'internal/webserver'
  - '**/zz_generated.*'
