coverage:
  status:
    # allow test coverage to drop by 0.1%, assume that it's typically due to CI problems
    patch:
      default:
        threshold: 0.1
    project:
      default:
        threshold: 0.1
      # Vitest lcov from CI (ui/dashboard, ui/extension) + any hits under shared UI packages
      ui:
        target: auto
        threshold: 0.1
        paths:
          - ui/dashboard
          - ui/extension
          - ui/components-lib
          - ui/shared
ignore:
  - 'api/v1alpha1'
  - 'applyconfiguration'
  - 'test'
  - 'cmd'
  - 'config'
  - 'dist'
  - 'hack'
  - 'internal/scms/mock'
  - 'internal/controller/testutils'
  # The dashboard HTTP server (gitops-promoter dashboard) is not started by the e2e suite, so this
  # package only shows up, at zero hits, once the manager image is built with -cover.
  # TODO: exercise internal/webserver in the e2e tests, then drop this ignore.
  - 'internal/webserver'
  - '**/zz_generated.*'
