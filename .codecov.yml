coverage:
  status:
    # allow test coverage to drop by 0.1%, assume that it's typically due to CI problems
    patch:
      default:
        threshold: 0.1
    project:
      default:
        threshold: 0.1
      # Merged coverage of UI sources. The Vitest upload is also flagged `ui`
      # (see flag_management) so the PR comment can show that suite on its own.
      # No component: it would repeat this same path filter.
      ui:
        target: auto
        threshold: 0.1
        paths:
          - ui/dashboard
          - ui/extension
          - ui/components-lib
          - ui/shared
# Flags label an upload. `ui` is only the Vitest lcov; `integration` is the Go profile.
# Paths limit the ui flag percentage to UI sources. No per-flag statuses: the project
# status above is already the check for those paths.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: ui
      carryforward: false
      paths:
        - ui/dashboard
        - ui/extension
        - ui/components-lib
        - ui/shared
ignore:
  - 'api/v1alpha1'
  - 'applyconfiguration'
  - 'test'
  - 'cmd'
  - 'config'
  - 'dist'
  - 'hack'
  - 'internal/scms/mock'
  - 'internal/controller/testutils'
  - '**/zz_generated.*'
