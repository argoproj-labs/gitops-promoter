apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-server
  labels:
    app.kubernetes.io/name: scm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scm-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scm-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: scm-server
          image: scm-server:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --public-host=scm-server.scm-server.svc
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --ca-cert=/tls/ca.crt
          ports:
            - name: admin
              containerPort: 9000
            - name: github
              containerPort: 9001
            - name: gitlab
              containerPort: 9002
            - name: azuredevops
              containerPort: 9003
            - name: bitbucket
              containerPort: 9004
            - name: gitea
              containerPort: 9005
            - name: forgejo
              containerPort: 9006
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: tls
          secret:
            secretName: scm-server-tls
        - name: data
          emptyDir: {}
